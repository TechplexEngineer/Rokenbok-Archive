{{ define "main" }}

	{{ partial "jumbotron" (dict "imageUrl" .Site.Data.constants.jumbotronImg "title" .Params.title "subtitle" (printf "%s (%d sets)" .Params.subtitle (len .Pages)) ) }}

	<div class="container">
		<div class="row">
			{{ range .Pages.ByParam "year" }}
				{{ .Render "li" }}
			{{ end }}
		</div>
	</div>
{{end}}
